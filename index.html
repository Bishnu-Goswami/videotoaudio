<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Status Audio/Video Converter</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FFmpeg WASM (v0.12) -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
    <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
    <style>
        /* Simple pulse animation for the loading state */
        .pulse-text { animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-6 font-sans">
    <div class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-lg">
        <h1 class="text-2xl font-bold mb-6 text-gray-800">StarMaker to WhatsApp Status Converter</h1>
        
        <!-- Input File -->
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-2">1. Upload StarMaker Video/Audio</label>
            <input type="file" id="mediaInput" accept="video/*,audio/*" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        </div>

        <!-- Conversion Mode -->
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-2">2. Choose Output Format</label>
            <div class="flex items-center space-x-4">
                <label class="flex items-center">
                    <input type="radio" name="mode" value="mp3" checked class="text-blue-600 focus:ring-blue-500" onchange="toggleOptions()">
                    <span class="ml-2 text-gray-700">Extract MP3 Audio</span>
                </label>
                <label class="flex items-center">
                    <input type="radio" name="mode" value="mp4" class="text-blue-600 focus:ring-blue-500" onchange="toggleOptions()">
                    <span class="ml-2 text-gray-700">Create MP4 for WhatsApp</span>
                </label>
            </div>
        </div>

        <!-- MP4 specific options -->
        <div id="mp4Options" class="hidden mb-6 p-4 border border-gray-200 rounded-md bg-gray-50">
            <label class="block text-sm font-medium text-gray-700 mb-2">Visual Background for WhatsApp</label>
            
            <div class="mb-4">
                <label class="flex items-center mb-2">
                    <input type="radio" name="bgType" value="text" checked class="text-blue-600 focus:ring-blue-500" onchange="toggleBgOptions()">
                    <span class="ml-2 text-gray-700">Custom Text (Black Background)</span>
                </label>
                <input type="text" id="textInput" placeholder="Enter lyrics or title here..." class="w-full mt-1 p-2 border border-gray-300 rounded-md">
            </div>

            <div>
                <label class="flex items-center mb-2">
                    <input type="radio" name="bgType" value="image" class="text-blue-600 focus:ring-blue-500" onchange="toggleBgOptions()">
                    <span class="ml-2 text-gray-700">Upload Custom Image</span>
                </label>
                <input type="file" id="imageInput" accept="image/*" class="hidden w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-gray-100 file:text-gray-700">
            </div>
        </div>

        <!-- Action Button -->
        <button id="processBtn" onclick="processMedia()" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-md hover:bg-blue-700 transition">
            Process File
        </button>

        <!-- Log & Progress -->
        <div class="mt-6">
            <p id="status" class="text-sm font-semibold text-gray-700 mb-2"></p>
            
            <div class="w-full bg-gray-200 rounded-full h-2.5 mb-2 hidden" id="progressContainer">
                <div class="bg-blue-600 h-2.5 rounded-full transition-all duration-300" id="progressBar" style="width: 0%"></div>
            </div>
            
            <p id="log" class="text-xs text-gray-500 font-mono h-32 overflow-y-auto bg-gray-100 p-2 rounded border whitespace-pre-wrap"></p>
        </div>

        <!-- Download Link -->
        <a id="downloadLink" class="hidden mt-4 block w-full text-center bg-green-500 text-white font-bold py-3 px-4 rounded-md hover:bg-green-600 transition shadow-lg">
            ⬇️ Download Result
        </a>
    </div>

    <script>
        const { FFmpeg } = FFmpegWASM;
        const { fetchFile, toBlobURL } = FFmpegUtil; // Added toBlobURL to fix Firefox/CORS issues
        let ffmpeg = null;

        function toggleOptions() {
            const mode = document.querySelector('input[name="mode"]:checked').value;
            document.getElementById('mp4Options').style.display = mode === 'mp4' ? 'block' : 'none';
        }

        function toggleBgOptions() {
            const bgType = document.querySelector('input[name="bgType"]:checked').value;
            const textInput = document.getElementById('textInput');
            const imageInput = document.getElementById('imageInput');
            
            if (bgType === 'text') {
                textInput.classList.remove('hidden');
                imageInput.classList.add('hidden');
            } else {
                textInput.classList.add('hidden');
                imageInput.classList.remove('hidden');
            }
        }

        function createTextCanvasBlob(text) {
            return new Promise((resolve) => {
                const canvas = document.createElement('canvas');
                canvas.width = 720; 
                canvas.height = 1280;
                const ctx = canvas.getContext('2d');
                
                ctx.fillStyle = '#111111';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = '#FFFFFF';
                ctx.font = 'bold 40px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                const words = text.split(' ');
                let line = '';
                let y = canvas.height / 2;
                const lineHeight = 60;
                
                for(let n = 0; n < words.length; n++) {
                    let testLine = line + words[n] + ' ';
                    let metrics = ctx.measureText(testLine);
                    if (metrics.width > canvas.width - 100 && n > 0) {
                        ctx.fillText(line, canvas.width / 2, y);
                        line = words[n] + ' ';
                        y += lineHeight;
                    } else {
                        line = testLine;
                    }
                }
                ctx.fillText(line, canvas.width / 2, y);
                
                canvas.toBlob(resolve, 'image/jpeg', 0.9);
            });
        }

        async function processMedia() {
            const mediaFile = document.getElementById('mediaInput').files[0];
            if (!mediaFile) {
                alert("Please upload a media file first!");
                return;
            }

            const btn = document.getElementById('processBtn');
            const status = document.getElementById('status');
            const logBox = document.getElementById('log');
            const progressBar = document.getElementById('progressBar');
            const progressContainer = document.getElementById('progressContainer');
            const downloadLink = document.getElementById('downloadLink');

            btn.disabled = true;
            btn.classList.add('opacity-50');
            downloadLink.classList.add('hidden');
            progressContainer.classList.add('hidden');
            status.classList.remove('text-red-600');
            status.classList.add('pulse-text'); // Add animation for download phase
            logBox.innerHTML = "";
            progressBar.style.width = "0%";

            try {
                if (!ffmpeg) {
                    ffmpeg = new FFmpeg();
                    
                    ffmpeg.on('log', ({ message }) => {
                        logBox.innerHTML += message + "\n";
                        logBox.scrollTop = logBox.scrollHeight;
                    });
                    
                    ffmpeg.on('progress', ({ progress }) => {
                        progressBar.style.width = `${Math.round(progress * 100)}%`;
                    });

                    // LOAD ENGINE WITH FALLBACKS AND BLOB URLs (Fixes Firefox/CORS issue)
                    try {
                        status.innerText = "Downloading FFmpeg engine from Primary CDN (~25MB)...";
                        const baseURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd';
                        await ffmpeg.load({
                            coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
                            wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm')
                        });
                    } catch (primaryErr) {
                        console.warn("Primary CDN failed, trying fallback...", primaryErr);
                        logBox.innerHTML += `\n[Warning] Primary server failed. Switching to fallback...\n`;
                        status.innerText = "Downloading from Fallback CDN...";
                        
                        const fallbackURL = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd';
                        await ffmpeg.load({
                            coreURL: await toBlobURL(`${fallbackURL}/ffmpeg-core.js`, 'text/javascript'),
                            wasmURL: await toBlobURL(`${fallbackURL}/ffmpeg-core.wasm`, 'application/wasm')
                        });
                    }
                }

                status.classList.remove('pulse-text'); // Stop animation
                progressContainer.classList.remove('hidden'); // Show bar for processing
                status.innerText = "Reading input file...";
                
                // Sanitize file name to avoid FFmpeg path issues
                const ext = mediaFile.name.substring(mediaFile.name.lastIndexOf('.'));
                const inputName = 'input_media' + ext;
                
                await ffmpeg.writeFile(inputName, await fetchFile(mediaFile));

                const mode = document.querySelector('input[name="mode"]:checked').value;

                if (mode === 'mp3') {
                    status.innerText = "Extracting Audio to MP3...";
                    await ffmpeg.exec(['-i', inputName, '-vn', '-b:a', '192k', 'output.mp3']);
                    
                    const data = await ffmpeg.readFile('output.mp3');
                    const blob = new Blob([data.buffer], { type: 'audio/mp3' });
                    setupDownload(blob, 'extracted_audio.mp3');
                } 
                else if (mode === 'mp4') {
                    status.innerText = "Preparing Background Image...";
                    const bgType = document.querySelector('input[name="bgType"]:checked').value;
                    let imageBlob;
                    
                    if (bgType === 'text') {
                        const text = document.getElementById('textInput').value || "Playing Audio...";
                        imageBlob = await createTextCanvasBlob(text);
                    } else {
                        imageBlob = document.getElementById('imageInput').files[0];
                        if (!imageBlob) {
                            throw new Error("No image selected. Please upload an image or select Custom Text.");
                        }
                    }

                    await ffmpeg.writeFile('bg_image.jpg', await fetchFile(imageBlob));

                    status.innerText = "Encoding Video for WhatsApp... (This will take a moment)";
                    
                    await ffmpeg.exec([
                        '-loop', '1', 
                        '-i', 'bg_image.jpg', 
                        '-i', inputName, 
                        '-map', '0:v:0', 
                        '-map', '1:a:0', 
                        '-c:v', 'libx264', 
                        '-tune', 'stillimage', 
                        '-c:a', 'aac', 
                        '-b:a', '192k', 
                        '-pix_fmt', 'yuv420p', 
                        '-shortest', 
                        'output.mp4'
                    ]);

                    const data = await ffmpeg.readFile('output.mp4');
                    const blob = new Blob([data.buffer], { type: 'video/mp4' });
                    setupDownload(blob, 'whatsapp_status.mp4');
                }
                
                status.innerText = "✅ Processing Complete!";
                progressBar.style.width = "100%";
                
            } catch (err) {
                console.error(err);
                status.classList.remove('pulse-text');
                status.innerText = "❌ An error occurred during execution.";
                status.classList.add('text-red-600');
                
                logBox.innerHTML += `\n<span style="color: red; font-weight: bold;">ERROR: ${err.message || err}</span>\n`;
                logBox.scrollTop = logBox.scrollHeight;
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }
        }

        function setupDownload(blob, filename) {
            const url = URL.createObjectURL(blob);
            const downloadLink = document.getElementById('downloadLink');
            downloadLink.href = url;
            downloadLink.download = filename;
            downloadLink.classList.remove('hidden');
        }

        toggleOptions();
    </script>
</body>
</html>
